name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
        continue-on-error: true

      - name: Deploy to GitHub Pages (Environment)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to gh-pages branch (fallback)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f index.html todo.html README.md .nojekyll
          git stash
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git reset
          git checkout stash -- index.html todo.html README.md .nojekyll 2>/dev/null || true
          git stash drop 2>/dev/null || true
          git add index.html todo.html README.md .nojekyll 2>/dev/null || true
          git commit -m "Deploy: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "Nothing to commit"
          git push origin gh-pages --force

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — To-Do & Habit Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper: #FAF7F0;
    --paper-line: #DCD5C6;
    --ink: #1D2B3A;
    --ink-soft: #5B6672;
    --teal: #3F6C6B;
    --teal-soft: #DCE8E7;
    --rust: #A85C32;
    --rust-soft: #F3E3D6;
    --danger: #A83232;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:32px 20px 80px;
  }

  .page{
    max-width:920px;
    margin:0 auto;
  }

  header.masthead{
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:8px;
  }

  header.masthead h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0;
    letter-spacing:-0.01em;
  }

  header.masthead .date{
    font-size:0.9rem;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .columns{
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap:36px;
  }

  @media (max-width: 760px){
    .columns{ grid-template-columns: 1fr; }
  }

  section.block{ margin-bottom: 12px; }

  section.block h2{
    font-family:'Source Serif 4',serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--paper-line);
  }

  form.add-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }

  input[type=text], input[type=date], select{
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    padding:8px 10px;
    border:1px solid var(--paper-line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }

  form.add-row input[type=text]{ flex: 1 1 160px; }
  form.add-row select{ flex: 0 0 auto; }
  form.add-row input[type=date]{ flex: 0 0 auto; }

  button{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:0.88rem;
    padding:8px 14px;
    border-radius:3px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  button:hover{ opacity:0.88; }
  button.ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--paper-line);
    font-size:0.78rem;
    padding:5px 9px;
  }
  button.ghost:hover{ border-color:var(--danger); color:var(--danger); opacity:1;}

  ul.todo-list{ list-style:none; margin:0; padding:0; }

  li.todo-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--paper-line);
  }

  li.todo-row.done .todo-text{
    text-decoration:line-through;
    color:var(--ink-soft);
  }

  .checkbox{
    width:18px; height:18px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    flex:0 0 18px;
    margin-top:2px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
  }
  li.todo-row.done .checkbox{ background:var(--teal); border-color:var(--teal); color:#fff; font-size:12px;}

  .todo-body{ flex:1; min-width:0; }
  .todo-text{ font-size:0.94rem; line-height:1.4; word-break:break-word;}
  .todo-meta{ font-size:0.76rem; color:var(--ink-soft); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}

  .tag{
    display:inline-block;
    padding:1px 7px;
    border-radius:10px;
    font-size:0.72rem;
  }
  .tag.high{ background:var(--rust-soft); color:var(--rust); }
  .tag.medium{ background:#F1EAD6; color:#8A6D1E; }
  .tag.low{ background:var(--teal-soft); color:var(--teal); }
  .tag.overdue{ background:var(--rust-soft); color:var(--danger); }

  .empty{
    font-size:0.85rem;
    color:var(--ink-soft);
    font-style:italic;
    padding:14px 0;
  }

  /* Habits */
  .habit-row{
    padding:12px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .habit-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .habit-name{ font-size:0.92rem; font-weight:500; }
  .habit-streak{
    font-size:0.76rem;
    color:var(--teal);
    font-weight:600;
    white-space:nowrap;
  }
  .habit-days{
    display:flex;
    gap:6px;
  }
  .day-cell{
    flex:1;
    text-align:center;
  }
  .day-label{
    font-size:0.62rem;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .day-dot{
    width:100%;
    aspect-ratio:1;
    max-width:26px;
    margin:0 auto;
    border-radius:5px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    cursor:pointer;
  }
  .day-dot.checked{ background:var(--teal); border-color:var(--teal); }
  .day-dot.today{ border-color:var(--ink); }

  .stats-bar{
    margin-top:30px;
    padding-top:16px;
    border-top:2px solid var(--ink);
    display:flex;
    gap:28px;
    flex-wrap:wrap;
  }
  .stat{ }
  .stat .num{ font-family:'Source Serif 4',serif; font-size:1.6rem; font-weight:700; line-height:1;}
  .stat .label{ font-size:0.76rem; color:var(--ink-soft); margin-top:2px;}

  .status-msg{ font-size:0.78rem; color:var(--ink-soft); margin-bottom:10px; min-height:1em;}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1>The Ledger</h1>
    <div class="date" id="todayDate"></div>
  </header>

  <div class="status-msg" id="statusMsg"></div>

  <div class="columns">

    <section class="block">
      <h2>Today's tasks</h2>
      <form class="add-row" id="todoForm">
        <input type="text" id="todoText" placeholder="Add a task…" required>
        <select id="todoPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input type="date" id="todoDue">
        <button type="submit">Add</button>
      </form>
      <ul class="todo-list" id="todoList"></ul>
    </section>

    <section class="block">
      <h2>Daily habits</h2>
      <form class="add-row" id="habitForm">
        <input type="text" id="habitText" placeholder="Add a habit…" required>
        <button type="submit">Add</button>
      </form>
      <div id="habitList"></div>
    </section>

  </div>

  <div class="stats-bar" id="statsBar"></div>

</div>

<script>
const $ = (id) => document.getElementById(id);

let todos = [];
let habits = []; // { id, name, days: { 'YYYY-MM-DD': true } }

function todayISO(){
  return new Date().toISOString().slice(0,10);
}

function last7Days(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function setStatus(msg, isError){
  const el = $('statusMsg');
  el.textContent = msg || '';
  el.style.color = isError ? '#A83232' : '';
  if(msg){ setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2500); }
}

async function loadAll(){
  setStatus('Loading your ledger…');
  try{
    const t = await window.storage.get('todos', false);
    todos = t ? JSON.parse(t.value) : [];
  }catch(e){ todos = []; }
  try{
    const h = await window.storage.get('habits', false);
    habits = h ? JSON.parse(h.value) : [];
  }catch(e){ habits = []; }
  setStatus('');
  render();
}

async function saveTodos(){
  try{
    await window.storage.set('todos', JSON.stringify(todos), false);
  }catch(e){ setStatus('Could not save tasks — try again.', true); }
}

async function saveHabits(){
  try{
    await window.storage.set('habits', JSON.stringify(habits), false);
  }catch(e){ setStatus('Could not save habits — try again.', true); }
}

function computeStreak(habit){
  let streak = 0;
  let d = new Date();
  while(true){
    const iso = d.toISOString().slice(0,10);
    if(habit.days && habit.days[iso]){
      streak++;
      d.setDate(d.getDate()-1);
    } else {
      break;
    }
  }
  return streak;
}

function renderTodos(){
  const list = $('todoList');
  list.innerHTML = '';
  if(todos.length === 0){
    list.innerHTML = '<div class="empty">Nothing on the ledger yet. Add your first task above.</div>';
    return;
  }
  const sorted = [...todos].sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    const order = {high:0, medium:1, low:2};
    return order[a.priority] - order[b.priority];
  });

  sorted.forEach(todo => {
    const li = document.createElement('li');
    li.className = 'todo-row' + (todo.done ? ' done' : '');

    const isOverdue = todo.due && !todo.done && todo.due < todayISO();

    li.innerHTML = `
      <div class="checkbox" data-id="${todo.id}">${todo.done ? '✓' : ''}</div>
      <div class="todo-body">
        <div class="todo-text">${escapeHtml(todo.text)}</div>
        <div class="todo-meta">
          <span class="tag ${todo.priority}">${todo.priority}</span>
          ${todo.due ? `<span class="tag ${isOverdue ? 'overdue' : ''}">${isOverdue ? 'overdue · ' : 'due '}${todo.due}</span>` : ''}
        </div>
      </div>
      <button class="ghost" data-del="${todo.id}">Remove</button>
    `;
    list.appendChild(li);
  });

  list.querySelectorAll('.checkbox').forEach(box => {
    box.addEventListener('click', () => toggleTodo(box.dataset.id));
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => removeTodo(btn.dataset.del));
  });
}

function renderHabits(){
  const container = $('habitList');
  container.innerHTML = '';
  if(habits.length === 0){
    container.innerHTML = '<div class="empty">No habits tracked yet. Add one to start a streak.</div>';
    return;
  }
  const days = last7Days();
  const dayLabels = days.map(iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', {weekday:'narrow'}));
  const today = todayISO();

  habits.forEach(habit => {
    const row = document.createElement('div');
    row.className = 'habit-row';
    const streak = computeStreak(habit);

    row.innerHTML = `
      <div class="habit-top">
        <div class="habit-name">${escapeHtml(habit.name)}</div>
        <div class="habit-streak">${streak > 0 ? streak + '-day streak' : 'no streak yet'}</div>
      </div>
      <div class="habit-days">
        ${days.map((iso, i) => `
          <div class="day-cell">
            <div class="day-label">${dayLabels[i]}</div>
            <div class="day-dot ${habit.days && habit.days[iso] ? 'checked' : ''} ${iso === today ? 'today' : ''}"
                 data-habit="${habit.id}" data-day="${iso}"></div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(row);
  });

  container.querySelectorAll('.day-dot').forEach(dot => {
    dot.addEventListener('click', () => toggleHabitDay(dot.dataset.habit, dot.dataset.day));
  });
}

function renderStats(){
  const doneToday = todos.filter(t => t.done).length;
  const totalTasks = todos.length;
  const activeStreaks = habits.filter(h => computeStreak(h) > 0).length;
  const longestStreak = habits.reduce((max, h) => Math.max(max, computeStreak(h)), 0);

  $('statsBar').innerHTML = `
    <div class="stat"><div class="num">${doneToday}/${totalTasks}</div><div class="label">tasks done</div></div>
    <div class="stat"><div class="num">${activeStreaks}</div><div class="label">habits on a streak</div></div>
    <div class="stat"><div class="num">${longestStreak}</div><div class="label">longest streak (days)</div></div>
  `;
}

function render(){
  renderTodos();
  renderHabits();
  renderStats();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function toggleTodo(id){
  todos = todos.map(t => t.id === id ? {...t, done: !t.done} : t);
  render();
  await saveTodos();
}

async function removeTodo(id){
  todos = todos.filter(t => t.id !== id);
  render();
  await saveTodos();
}

async function toggleHabitDay(habitId, day){
  habits = habits.map(h => {
    if(h.id !== habitId) return h;
    const days = {...(h.days || {})};
    if(days[day]) delete days[day]; else days[day] = true;
    return {...h, days};
  });
  render();
  await saveHabits();
}

$('todoForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('todoText').value.trim();
  if(!text) return;
  todos.push({
    id: 't' + Date.now(),
    text,
    priority: $('todoPriority').value,
    due: $('todoDue').value || null,
    done: false
  });
  $('todoText').value = '';
  $('todoDue').value = '';
  render();
  await saveTodos();
});

$('habitForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('habitText').value.trim();
  if(!name) return;
  habits.push({ id: 'h' + Date.now(), name, days: {} });
  $('habitText').value = '';
  render();
  await saveHabits();
});

$('todayDate').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

loadAll();
</script>
</body>
</html>
